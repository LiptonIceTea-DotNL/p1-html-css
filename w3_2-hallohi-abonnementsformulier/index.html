<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hallo Hi abonnementsformulier</title>
</head>
<body>
    <form>
        <label for="firstName">Voornaam:</label>
        <input type="text" pattern="[a-zA-Z]" name="firstName" title="Geen cijfers gebruiken" required>
        <label for="lastName">Achternaam:</label>
        <input type="text" pattern="[a-zA-Z]" name="lastName" title="Geen cijfers gebruiken" required>
        <br>
        <br>
        <p>Aanhef:</p>
        <label for="gender">Dhr.</label>
        <input type="radio" checked name="gender">
        <label for="gender">Mevr.</label>
        <input type="radio" name="gender">
        <label for="gender">Anders</label>
        <input type="radio" name="gender">
        <br>
        <br>
        <br>
        <label for="street">Straat en huisnummer:</label>
        <input type="text" name="street" pattern="" placeholder="Stationsweg 12" required>
        <label for="zip-code">Postcode:</label>
        <input type="text" name="zip-code" pattern="[0-9]{4} ?[A-Za-z]{2}" placeholder="1234 AB" required>
        <br>
        <br>
        <label for="city">Woonplaats:</label>
        <input type="text" name="city"> 
        <label for="country">Land:</label>
        <select name="country">
            <option value="netherlands">Nederland</option>
            <option value="belgium">België</option>
            <option value="luxembourg">Luxemburg</option>
            <option value="germany">Duitsland</option>
            <option value="france">Frankrijk</option>
        </select>
        <br>
        <br>
        <br>
        <br>
        <label for="iban">IBAN:</label>
        <input type="text" name="iban" pattern="NL[0-9]{2}[A-Z]{4}[0-9]{10}" maxlength="18" placeholder="NL91ABNA0417164300" required>
        <label for="subscription">Abonnement</label>
        <select name="subscription">
            <option value="mobile">Mobiel</option>
            <option value="fiber">Glasvezel</option>
            <option value="tv">TV</option>
        </select>
        <label for="date">Datum ingang abonnement:</label>
        <input type="date" name="date" min="2026-09-23" required>
        <p>Looptijd abbonement: 12 maanden</p>
        <label for="total-subscriptions">Aantal gebruikers op het abonnement:</label>
        <input type="number" name="total-subscriptions" min="0" max="4" required>
        <br>
        <br>
        <br>
        <label for="email">E-mailadres:</label>
        <input type="email" name="email" required>
        <label for="password">Wachtwoord:</label>
        <input type="password" name="password" required>
        <br>
        <br>
        <input type="submit" value="Sluit abonnement af">
    </form>
</body>
</html>
