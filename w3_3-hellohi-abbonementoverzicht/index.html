<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">
    <title>Hallo Hi Abonnementenoverzicht</title>
</head>
<body>
    <h1>Hallo Hi Abonnementenoverzicht</h1>
    <table>
        <thead>
            <tr class="table-categories">
                <th>Abonnement</th>
                <th>Snelheid</th>
                <th>Data</th>
                <th>Maandprijs</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td class="table-types">Basic</td>
                <td class="table-values">300mb/s</td>
                <td class="table-values">2GB</td>
                <td class="table-values">16,50,-</td>
            </tr>
            <tr>
                <td class="table-types">Start</td>
                <td class="table-values">300mb/s</td>
                <td class="table-values">10GB</td>
                <td class="table-values">18,00,-</td>
            </tr>
            <tr>
                <td class="table-types">Unlimited</td>
                <td class="table-values">400mb/s</td>
                <td class="table-values">50GB</td>
                <td class="table-values">32,50,-</td>
            </tr>
            <tr>
                <td class="table-types">Unlimited Plus</td>
                <td class="table-values">700mb/s</td>
                <td class="table-values">60GB</td>
                <td class="table-values table-corner">37,50,-</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
